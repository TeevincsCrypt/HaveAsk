# One-click deploy on Render: New + > Blueprint > pick this repo.
services:
  - type: web
    name: haveask
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      # Optional: uncomment and set in the Render dashboard to use Claude for request analysis.
      # - key: ANTHROPIC_API_KEY
      #   sync: false
